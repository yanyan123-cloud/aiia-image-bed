<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="720" viewBox="0 0 1240 720" role="img" aria-labelledby="title desc">
  <title id="title">原始事件如何变成三项查询共用的记录</title><desc id="desc">用户输入、模型回复、文件修改和测试命令先整理为统一过程记录，再供摘要、详情和班级汇总使用。</desc>
  <defs><marker id="arrow" viewBox="0 0 12 12" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" refX="12" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 Z" fill="#52616B"/></marker><filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#18364A" flood-opacity=".12"/></filter></defs>
  <rect width="1240" height="720" fill="#F7FAFC"/><rect x="40" y="32" width="1160" height="82" rx="18" fill="#143A52"/>
  <text x="76" y="80" font-family="Microsoft YaHei, Noto Sans SC, Arial" font-size="31" font-weight="700" fill="#FFFFFF">一份记录清单，为什么能服务三项查询？</text><text x="76" y="102" font-family="Microsoft YaHei, Noto Sans SC, Arial" font-size="16" fill="#D7E8F0">先整理底层事件，再让摘要、详情和班级汇总从同一份清单取数</text>
  <rect x="40" y="146" width="1160" height="430" rx="18" fill="#FFFFFF" stroke="#DDE6EC"/><text x="68" y="184" font-family="Microsoft YaHei, Noto Sans SC, Arial" font-size="18" font-weight="700" fill="#52616B">一次提交的示例</text>
  <g filter="url(#shadow)"><rect x="70" y="218" width="280" height="276" rx="18" fill="#FFF7ED" stroke="#FB923C" stroke-width="2"/><rect x="480" y="218" width="280" height="276" rx="18" fill="#EDE9FE" stroke="#8B5CF6" stroke-width="2"/><rect x="890" y="218" width="280" height="276" rx="18" fill="#E0F2FE" stroke="#38BDF8" stroke-width="2"/></g>
  <text x="210" y="260" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans SC, Arial" font-size="23" font-weight="700" fill="#9A3412">数据库原始事件</text><g font-family="Microsoft YaHei, Noto Sans SC, Arial" font-size="17" fill="#334155"><rect x="102" y="288" width="216" height="38" rx="10" fill="#FFFFFF" stroke="#FED7AA"/><text x="120" y="313">用户输入</text><rect x="102" y="338" width="216" height="38" rx="10" fill="#FFFFFF" stroke="#FED7AA"/><text x="120" y="363">模型回复</text><rect x="102" y="388" width="216" height="38" rx="10" fill="#FFFFFF" stroke="#FED7AA"/><text x="120" y="413">文件修改</text><rect x="102" y="438" width="216" height="38" rx="10" fill="#FFFFFF" stroke="#FED7AA"/><text x="120" y="463">测试命令</text></g>
  <text x="620" y="260" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans SC, Arial" font-size="23" font-weight="700" fill="#5B21B6">归一化过程记录</text><text x="620" y="287" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans SC, Arial" font-size="15" fill="#475569">按统一规则整理后，对外只保留 3 条</text><g font-family="Microsoft YaHei, Noto Sans SC, Arial" font-size="17" fill="#334155"><rect x="512" y="310" width="216" height="42" rx="10" fill="#FFFFFF" stroke="#C4B5FD"/><text x="530" y="337">AI 交互</text><rect x="512" y="366" width="216" height="42" rx="10" fill="#FFFFFF" stroke="#C4B5FD"/><text x="530" y="393">文件修改</text><rect x="512" y="422" width="216" height="42" rx="10" fill="#FFFFFF" stroke="#C4B5FD"/><text x="530" y="449">测试执行</text></g>
  <text x="1030" y="260" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans SC, Arial" font-size="23" font-weight="700" fill="#075985">三项查询各取所需</text><g font-family="Microsoft YaHei, Noto Sans SC, Arial" fill="#334155"><rect x="922" y="292" width="216" height="52" rx="10" fill="#FFFFFF" stroke="#7DD3FC"/><text x="940" y="315" font-size="16" font-weight="700">提交摘要</text><text x="940" y="335" font-size="14">记录数：3</text><rect x="922" y="360" width="216" height="52" rx="10" fill="#FFFFFF" stroke="#7DD3FC"/><text x="940" y="383" font-size="16" font-weight="700">提交详情</text><text x="940" y="403" font-size="14">按页返回这 3 条</text><rect x="922" y="428" width="216" height="52" rx="10" fill="#FFFFFF" stroke="#7DD3FC"/><text x="940" y="451" font-size="16" font-weight="700">班级汇总</text><text x="940" y="471" font-size="14">按类型累计这 3 条</text></g>
  <path d="M350 355 H468" stroke="#52616B" stroke-width="3" marker-end="url(#arrow)"/><text x="409" y="335" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans SC, Arial" font-size="15" fill="#475569">配对、分类</text><path d="M760 355 H878" stroke="#52616B" stroke-width="3" marker-end="url(#arrow)"/><text x="819" y="335" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans SC, Arial" font-size="15" fill="#475569">共用同一清单</text>
  <rect x="40" y="606" width="1160" height="74" rx="18" fill="#FFFFFF" stroke="#DDE6EC"/><text x="74" y="650" font-family="Microsoft YaHei, Noto Sans SC, Arial" font-size="19" font-weight="700" fill="#0F172A">同一份清单保证：摘要的计数、详情的总数和班级汇总的统计口径能够对得上。</text>
</svg>
