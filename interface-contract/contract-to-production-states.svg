<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="700" viewBox="0 0 1240 700" role="img" aria-labelledby="title desc">
  <title id="title">接口从签收到生产开放的三个阶段</title><desc id="desc">合同已签收、实现和验证、生产开放是三个不同阶段。</desc>
  <defs><marker id="arrow" viewBox="0 0 12 12" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" refX="12" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 Z" fill="#52616B"/></marker><filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#18364A" flood-opacity=".12"/></filter></defs>
  <rect width="1240" height="700" fill="#F7FAFC"/><rect x="40" y="32" width="1160" height="82" rx="18" fill="#143A52"/>
  <text x="76" y="80" font-family="Microsoft YaHei, Noto Sans SC, Arial" font-size="31" font-weight="700" fill="#FFFFFF">接口签收后，还要经过哪几步？</text><text x="76" y="102" font-family="Microsoft YaHei, Noto Sans SC, Arial" font-size="16" fill="#D7E8F0">合同签收、能力实现和生产开放分别回答不同的问题</text>
  <rect x="40" y="146" width="1160" height="390" rx="18" fill="#FFFFFF" stroke="#DDE6EC"/><text x="68" y="184" font-family="Microsoft YaHei, Noto Sans SC, Arial" font-size="18" font-weight="700" fill="#52616B">当前 P0 接口的位置</text>
  <g filter="url(#shadow)"><rect x="70" y="230" width="300" height="216" rx="18" fill="#DCFCE7" stroke="#22C55E" stroke-width="2"/><rect x="470" y="230" width="300" height="216" rx="18" fill="#FFF7ED" stroke="#FB923C" stroke-width="2"/><rect x="870" y="230" width="300" height="216" rx="18" fill="#E0F2FE" stroke="#38BDF8" stroke-width="2"/></g>
  <circle cx="108" cy="270" r="20" fill="#16A34A"/><text x="108" y="277" text-anchor="middle" font-family="Arial" font-size="19" font-weight="700" fill="#FFFFFF">1</text><text x="145" y="275" font-family="Microsoft YaHei, Noto Sans SC, Arial" font-size="24" font-weight="700" fill="#166534">合同已签收</text><text x="100" y="320" font-family="Microsoft YaHei, Noto Sans SC, Arial" font-size="17" fill="#334155">三方已同意：</text><text x="100" y="351" font-family="Microsoft YaHei, Noto Sans SC, Arial" font-size="17" fill="#334155">请求、响应、状态和错误码</text><text x="100" y="382" font-family="Microsoft YaHei, Noto Sans SC, Arial" font-size="17" fill="#334155">改动要走新版本再确认</text><rect x="100" y="400" width="210" height="28" rx="10" fill="#BBF7D0"/><text x="205" y="421" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans SC, Arial" font-size="15" font-weight="700" fill="#166534">约定已经固定</text>
  <circle cx="508" cy="270" r="20" fill="#F97316"/><text x="508" y="277" text-anchor="middle" font-family="Arial" font-size="19" font-weight="700" fill="#FFFFFF">2</text><text x="545" y="275" font-family="Microsoft YaHei, Noto Sans SC, Arial" font-size="24" font-weight="700" fill="#9A3412">实现和验证</text><text x="500" y="320" font-family="Microsoft YaHei, Noto Sans SC, Arial" font-size="17" fill="#334155">仍要完成：</text><text x="500" y="351" font-family="Microsoft YaHei, Noto Sans SC, Arial" font-size="17" fill="#334155">Schema、Case、查询和映射</text><text x="500" y="382" font-family="Microsoft YaHei, Noto Sans SC, Arial" font-size="17" fill="#334155">联调、安全和故障测试</text><rect x="500" y="400" width="210" height="28" rx="10" fill="#FED7AA"/><text x="605" y="421" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans SC, Arial" font-size="15" font-weight="700" fill="#9A3412">能力仍在建设</text>
  <circle cx="908" cy="270" r="20" fill="#0284C7"/><text x="908" y="277" text-anchor="middle" font-family="Arial" font-size="19" font-weight="700" fill="#FFFFFF">3</text><text x="945" y="275" font-family="Microsoft YaHei, Noto Sans SC, Arial" font-size="24" font-weight="700" fill="#075985">生产开放</text><text x="900" y="320" font-family="Microsoft YaHei, Noto Sans SC, Arial" font-size="17" fill="#334155">各项约定有运行证据后：</text><text x="900" y="351" font-family="Microsoft YaHei, Noto Sans SC, Arial" font-size="17" fill="#334155">才允许真实业务调用</text><text x="900" y="382" font-family="Microsoft YaHei, Noto Sans SC, Arial" font-size="17" fill="#334155">当前阶段：暂不开放</text><rect x="900" y="400" width="210" height="28" rx="10" fill="#BAE6FD"/><text x="1005" y="421" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans SC, Arial" font-size="15" font-weight="700" fill="#075985">风险已被验证</text>
  <path d="M370 338 H458" stroke="#52616B" stroke-width="3" marker-end="url(#arrow)"/><text x="414" y="319" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans SC, Arial" font-size="15" fill="#475569">按合同开发</text><path d="M770 338 H858" stroke="#52616B" stroke-width="3" marker-end="url(#arrow)"/><text x="814" y="319" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans SC, Arial" font-size="15" fill="#475569">验证后开放</text>
  <rect x="40" y="566" width="1160" height="94" rx="18" fill="#FFFFFF" stroke="#DDE6EC"/><text x="74" y="606" font-family="Microsoft YaHei, Noto Sans SC, Arial" font-size="21" font-weight="700" fill="#0F172A">读图要点</text><text x="74" y="636" font-family="Microsoft YaHei, Noto Sans SC, Arial" font-size="17" fill="#334155">签收说明“大家同意怎么做”；测试与联调说明“系统已经能这样做”；只有后者完成，接口才适合开放给真实业务。</text>
</svg>
