<svg xmlns="http://www.w3.org/2000/svg" width="720" height="460" viewBox="0 0 720 460" role="img" aria-labelledby="title desc">
  <title id="title">同一段回答，两种等待方式</title>
  <desc id="desc">时间由左向右。完整返回需要等待整段生成，流式返回可以在生成过程中陆续显示。图示没有真实耗时数据。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#52616B"/></marker>
  </defs>
  <style>
    text { font-family: "Microsoft YaHei", "Noto Sans SC", sans-serif; fill: #334155; }
    .title { font-size: 32px; font-weight: 700; fill: #FFFFFF; }
    .label { font-size: 30px; font-weight: 700; }
    .detail { font-size: 28px; }
    .muted { fill: #52616B; }
    .arrow { fill: none; stroke: #52616B; stroke-width: 3; marker-end: url(#arrow); }
  </style>
  <rect width="720" height="460" fill="#F7FAFC"/>
  <rect x="24" y="24" width="672" height="76" rx="16" fill="#143A52"/>
  <text x="48" y="73" class="title">同一段回答，两种等待方式</text>
  <path d="M182 146 H672" class="arrow"/>
  <text x="182" y="132" class="detail">发问</text>
  <text x="674" y="132" text-anchor="end" class="detail">回复结束</text>
  <text x="42" y="235" class="label">完整返回</text>
  <rect x="182" y="186" width="514" height="84" rx="14" fill="#FFFFFF" stroke="#D7E2EA"/>
  <rect x="196" y="200" width="322" height="56" rx="10" fill="#FFF1F2"/>
  <text x="357" y="238" text-anchor="middle" class="label" style="fill:#9F1239">等待完整回答</text>
  <rect x="536" y="200" width="144" height="56" rx="10" fill="#E0F2FE"/>
  <text x="608" y="238" text-anchor="middle" class="label" style="fill:#075985">整段出现</text>
  <text x="42" y="333" class="label">流式返回</text>
  <rect x="182" y="290" width="514" height="106" rx="14" fill="#FFFFFF" stroke="#D7E2EA"/>
  <text x="197" y="333" class="detail muted">等待</text>
  <rect x="272" y="302" width="114" height="52" rx="10" fill="#DCFCE7"/>
  <text x="329" y="338" text-anchor="middle" class="label" style="fill:#166534">先</text>
  <path d="M391 328 H405" class="arrow"/>
  <rect x="412" y="302" width="114" height="52" rx="10" fill="#DCFCE7"/>
  <text x="469" y="338" text-anchor="middle" class="label" style="fill:#166534">复习</text>
  <path d="M531 328 H545" class="arrow"/>
  <rect x="552" y="302" width="128" height="52" rx="10" fill="#DCFCE7"/>
  <text x="616" y="338" text-anchor="middle" class="label" style="fill:#166534">基础。</text>
  <text x="440" y="382" text-anchor="middle" class="detail muted">收到一段，就显示一段</text>
  <text x="360" y="434" text-anchor="middle" class="detail muted">示意：生成进度相同，仅比较返回方式</text>
</svg>
