<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="720" viewBox="0 0 1240 720" role="img" aria-labelledby="title desc">
  <title id="title">Prompt、Context 与 Harness 的职责关系</title>
  <desc id="desc">Prompt 说明目标和约束，Context 提供判断材料，Harness 负责受控调用环境并组织检查，三者共同支撑可验收的执行。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 12 12" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" refX="12" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 Z" fill="#52616B"/></marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#18364A" flood-opacity=".12"/></filter>
  </defs>
  <rect width="1240" height="720" fill="#F7FAFC"/>
  <rect x="40" y="32" width="1160" height="82" rx="18" fill="#143A52"/>
  <text x="76" y="80" font-family="Microsoft YaHei, Noto Sans SC, Arial" font-size="31" font-weight="700" fill="#FFFFFF">Prompt、Context 和 Harness：三个部分各管什么</text>
  <text x="76" y="102" font-family="Microsoft YaHei, Noto Sans SC, Arial" font-size="16" fill="#D7E8F0">它们需要配合，但不能互相替代</text>

  <g filter="url(#shadow)">
    <rect x="480" y="154" width="280" height="116" rx="18" fill="#FFF1F2" stroke="#FB7185" stroke-width="2"/>
    <rect x="80" y="380" width="330" height="136" rx="18" fill="#ECFDF5" stroke="#34D399" stroke-width="2"/>
    <rect x="830" y="380" width="330" height="136" rx="18" fill="#FFF7ED" stroke="#FB923C" stroke-width="2"/>
  </g>

  <circle cx="620" cy="430" r="100" fill="#E0F2FE" stroke="#0EA5E9" stroke-width="4"/>
  <text x="620" y="411" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans SC, Arial" font-size="28" font-weight="700" fill="#075985">Harness</text>
  <text x="620" y="445" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans SC, Arial" font-size="17" fill="#334155">控制工具和权限</text>
  <text x="620" y="473" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans SC, Arial" font-size="17" fill="#334155">组织检查与状态流转</text>

  <text x="620" y="197" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans SC, Arial" font-size="26" font-weight="700" fill="#9F1239">Prompt</text>
  <text x="620" y="228" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans SC, Arial" font-size="17" fill="#334155">说明目标和约束</text>
  <text x="620" y="252" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans SC, Arial" font-size="17" fill="#334155">例如：只做最小修改</text>

  <text x="245" y="422" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans SC, Arial" font-size="26" font-weight="700" fill="#047857">Context</text>
  <text x="245" y="456" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans SC, Arial" font-size="17" fill="#334155">日志、代码、规范</text>
  <text x="245" y="482" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans SC, Arial" font-size="17" fill="#334155">以及已确认的结论</text>

  <text x="995" y="422" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans SC, Arial" font-size="26" font-weight="700" fill="#9A3412">工程环境</text>
  <text x="995" y="456" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans SC, Arial" font-size="17" fill="#334155">工具、测试和权限</text>
  <text x="995" y="482" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans SC, Arial" font-size="17" fill="#334155">由 Harness 按规则调用</text>

  <path d="M620 280 V320" stroke="#52616B" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M420 448 H510" stroke="#52616B" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M740 448 H820" stroke="#52616B" stroke-width="3" marker-end="url(#arrow)"/>

  <rect x="170" y="610" width="900" height="85" rx="18" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/>
  <text x="620" y="648" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans SC, Arial" font-size="23" font-weight="700" fill="#0F172A">三者共同支撑一次可验收的执行</text>
  <text x="620" y="676" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans SC, Arial" font-size="17" fill="#475569">Prompt 定目标，Context 给材料，Harness 组织行动、检查和交接</text>
  <path d="M620 540 V600" stroke="#52616B" stroke-width="3" marker-end="url(#arrow)"/>
</svg>
